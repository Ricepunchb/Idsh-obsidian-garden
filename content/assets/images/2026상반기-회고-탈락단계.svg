<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <title>어느 단계에서 가장 많이 걸러졌나</title>
  <rect x="0" y="0" width="680" height="320" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="24" y="32" font-size="17" font-weight="700" fill="#0b0b0b">어느 단계에서 가장 많이 걸러졌나</text>
  <text x="24" y="52" font-size="12" fill="#52514e">2026년 상반기 지원 12건의 최종 탈락 단계</text>

  <!-- Gridlines -->
  <g>
    <line x1="220" y1="74" x2="220" y2="284" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="295" y1="74" x2="295" y2="284" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="370" y1="74" x2="370" y2="284" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="445" y1="74" x2="445" y2="284" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="520" y1="74" x2="520" y2="284" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="595" y1="74" x2="595" y2="284" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="220" y1="284" x2="595" y2="284" stroke="#c3c2b7" stroke-width="1"/>
    <text x="220" y="298" font-size="11" fill="#898781" text-anchor="middle">0</text>
    <text x="295" y="298" font-size="11" fill="#898781" text-anchor="middle">1</text>
    <text x="370" y="298" font-size="11" fill="#898781" text-anchor="middle">2</text>
    <text x="445" y="298" font-size="11" fill="#898781" text-anchor="middle">3</text>
    <text x="520" y="298" font-size="11" fill="#898781" text-anchor="middle">4</text>
    <text x="595" y="298" font-size="11" fill="#898781" text-anchor="middle">5</text>
  </g>

  <!-- Row 1: 서류 탈락, 6 -->
  <g>
    <text x="205" y="90" font-size="12" fill="#0b0b0b" text-anchor="end">서류 탈락</text>
    <rect x="220" y="79" width="450" height="22" rx="3" fill="#2a78d6"/>
    <text x="678" y="94" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">6</text>
  </g>

  <!-- Row 2: 코딩테스트 탈락, 2 -->
  <g>
    <text x="205" y="126" font-size="12" fill="#0b0b0b" text-anchor="end">코딩테스트 탈락</text>
    <rect x="220" y="115" width="150" height="22" rx="3" fill="#2a78d6"/>
    <text x="378" y="130" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">2</text>
  </g>

  <!-- Row 3: 인적성검사 이후 탈락, 1 -->
  <g>
    <text x="205" y="162" font-size="12" fill="#0b0b0b" text-anchor="end">인적성검사 이후 탈락</text>
    <rect x="220" y="151" width="75" height="22" rx="3" fill="#2a78d6"/>
    <text x="303" y="166" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">1</text>
  </g>

  <!-- Row 4: 1차면접(스크리닝) 탈락, 1 -->
  <g>
    <text x="205" y="198" font-size="12" fill="#0b0b0b" text-anchor="end">1차면접(스크리닝) 탈락</text>
    <rect x="220" y="187" width="75" height="22" rx="3" fill="#2a78d6"/>
    <text x="303" y="202" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">1</text>
  </g>

  <!-- Row 5: 최종면접 탈락, 1 -->
  <g>
    <text x="205" y="234" font-size="12" fill="#0b0b0b" text-anchor="end">최종면접 탈락</text>
    <rect x="220" y="223" width="75" height="22" rx="3" fill="#2a78d6"/>
    <text x="303" y="238" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">1</text>
  </g>

  <!-- Row 6: 무응답(콜드리젝 추정), 1 -->
  <g>
    <text x="205" y="270" font-size="12" fill="#0b0b0b" text-anchor="end">무응답(콜드리젝 추정)</text>
    <rect x="220" y="259" width="75" height="22" rx="3" fill="#898781"/>
    <text x="303" y="274" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">1</text>
  </g>

  <text x="24" y="312" font-size="11" fill="#898781">서류 단계에서 절반(6/12)이 걸러졌고, 면접까지 간 2건은 모두 최종 관문(1차·최종면접)에서 떨어졌다.</text>
</svg>
